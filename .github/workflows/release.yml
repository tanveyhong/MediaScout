name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }
      - run: pnpm verify
      - run: pnpm format:check
      - run: pnpm audit --prod
      - name: Validate signing configuration
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([bool]$env:CSC_LINK -xor [bool]$env:CSC_KEY_PASSWORD) {
            throw "Configure both Windows signing secrets or neither."
          }
      - name: Build signed installer when certificate secrets are configured
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm release:ci
      - run: pnpm pack:extension
      - name: Verify Authenticode signature when configured
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ($env:CSC_LINK) {
            $installer = Get-ChildItem dist -Filter "*.exe" |
              Where-Object Name -NotLike "*uninstaller*" |
              Select-Object -First 1
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Installer signature status is $($signature.Status)."
            }
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object {
              $_.Extension -In ".exe", ".blockmap" -or $_.Name -eq "latest.yml"
            } |
            ForEach-Object {
              "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            } | Set-Content dist/SHA256SUMS.txt
      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File |
            Where-Object {
              $_.Extension -In ".exe", ".blockmap", ".txt", ".zip" -or
              $_.Name -eq "latest.yml"
            } |
            Select-Object -ExpandProperty FullName
          gh release create "${{ github.ref_name }}" `
            $assets `
            --generate-notes `
            --title "Media Scout ${{ github.ref_name }}"
